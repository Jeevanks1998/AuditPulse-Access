<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in — AuditPulse Access</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="sso-callback">

<div class="auth-shell">
  <div class="auth-card auth-center">
    <div class="auth-logo" style="justify-content:center;">
      <div class="auth-logo-mark" style="background:#fff;overflow:hidden;"><img src="img/logo.png" alt="AuditPulse logo" style="width:100%;height:100%;object-fit:contain;"></div>
      <div class="auth-logo-text">AuditPulse Access</div>
    </div>

    <div class="auth-spinner" id="ssoCallbackSpinner"></div>

    <p id="ssoCallbackSuccess" hidden>Signed in — redirecting you to the dashboard…</p>

    <div id="ssoCallbackError" hidden>
      <p>Something went wrong finishing sign-in. The link may have expired.</p>
      <a class="btn btn--secondary" href="login.html" style="margin-top:var(--sp-4);">Back to sign in</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

<div style="text-align:center; padding: 18px 16px; font-size: 13px; color: var(--text-tertiary, #94A3B8); border-top: 1px solid var(--border, #E2E8F0);"><strong>Designed by Jeevan K S</strong></div>
</body>
</html>
